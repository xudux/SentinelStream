services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: sentinel_backend
    restart: always

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis
      - rabbitmq

    env_file:
      - ../.env

    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sentineldb
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//

  celery:

    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: sentinel_celery

    restart: always

    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

    depends_on:
      - backend
      - redis
      - rabbitmq

    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sentineldb
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//

  postgres:

    image: postgres:16

    container_name: sentinel_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentineldb

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  
  redis:

    image: redis:7

    container_name: sentinel_redis

    restart: always

    ports:
      - "6379:6379"

  rabbitmq:

    image: rabbitmq:3-management

    container_name: sentinel_rabbitmq

    restart: always

    ports:

      - "5673:5672"

      - "15673:15672"

  frontend:
    build:
      context: ../frontend
    container_name: sentinel_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true


volumes:
  postgres_data: